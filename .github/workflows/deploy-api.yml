name: Deploy API to VPS

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "compose.yaml"
      - ".github/workflows/deploy-api.yml"
      - "deploy/vps/**"
  workflow_dispatch:

concurrency:
  group: deploy-api-vps
  cancel-in-progress: true

env:
  IMAGE_NAME: imranwebstudio/bat-remover-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitHub Actions runners cannot SSH to this VPS (:22 times out). Redeploy via HTTPS webhook.
      - name: Trigger VPS redeploy webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_WEBHOOK_URL:-}" ] || [ -z "${DEPLOY_WEBHOOK_SECRET:-}" ]; then
            echo "Missing DEPLOY_WEBHOOK_URL or DEPLOY_WEBHOOK_SECRET"
            exit 1
          fi
          curl --fail-with-body --show-error --silent \
            -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "content-type: application/json" \
            -H "x-deploy-secret: $DEPLOY_WEBHOOK_SECRET" \
            -d "{\"image\":\"${IMAGE_NAME}:${GITHUB_SHA}\",\"sha\":\"$GITHUB_SHA\"}"
          echo
          echo "API deploy triggered for ${IMAGE_NAME}:${GITHUB_SHA}"
