name: Deploy API to VPS

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "compose.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-vps
  cancel-in-progress: true

env:
  IMAGE_NAME: imranwebstudio/bat-remover-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull and recreate API on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            STACK_DIR="/var/lib/docker/volumes/portainer_portainer_data/_data/compose/10"
            cd "$STACK_DIR"
            docker compose -p sentinel --env-file stack.env -f docker-compose.yml pull api
            docker compose -p sentinel --env-file stack.env -f docker-compose.yml up -d --force-recreate --no-deps api
            docker image prune -f
            echo "API deploy complete: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
