name: github-malware-remover

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: malware_remover
      POSTGRES_USER: malware_remover
      POSTGRES_PASSWORD: malware_remover
    ports:
      # Host 5434 avoids clashing with local Postgres; omit this publish on VPS if unused.
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malware_remover -d malware_remover"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: imranwebstudio/bat-remover-api:latest
    ports:
      - "${API_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      # Container listens on 3001; host publishes via API_PORT.
      API_PORT: "3001"
      # Compose network hostnames (overrides localhost URLs from .env).
      DATABASE_URL: postgresql://malware_remover:malware_remover@postgres:5432/malware_remover?schema=public
      DIRECT_DATABASE_URL: postgresql://malware_remover:malware_remover@postgres:5432/malware_remover?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
